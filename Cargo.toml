[package]
name = "ms2rescore-rs"
version = "0.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ms2rescore_rs"
crate-type = ["cdylib"]

[features]
# Thermo .raw reading via the .NET host (mzdata/thermo). On by default; build with
# --no-default-features where the prebuilt libnethost.lib cannot be linked.
default = ["thermo"]
thermo = ["mzdata/thermo"]

[dependencies]
mzdata = { version = "0.59.2", features = ["parallelism"] }
pyo3 = { version = "0.28.2", features = ["anyhow"] }
rayon = "1.10"
timsrust = "0.4.2"
rustyms = "0.11"
ordered-float = "5"
numpy = "0.28"
